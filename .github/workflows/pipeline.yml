name: Node Docker CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run test script from package.json
      - name: Run tests
        run: npm test

      # Step 5: Test building your Docker container
      - name: Build Docker image
        run: docker build -t node-docker-practice .
